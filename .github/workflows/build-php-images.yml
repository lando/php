name: Build PHP Images

on:
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/build-php-images.yml'
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - '.github/workflows/build-php-images.yml'
  workflow_dispatch:

jobs:
  buildx:
    runs-on: ${{ matrix.platform.runner }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        target: &targets
          - image: php
            tag: 8.6-fpm-7
            context: images/8.6-fpm
          - image: php
            tag: 8.6-apache-7
            context: images/8.6-apache
          - image: php
            tag: 8.5-fpm-7
            context: images/8.5-fpm
            min_php: 8.5.12
          - image: php
            tag: 8.5-apache-7
            context: images/8.5-apache
            min_php: 8.5.12
          - image: php
            tag: 8.4-fpm-7
            context: images/8.4-fpm
            min_php: 8.4.27
          - image: php
            tag: 8.4-apache-7
            context: images/8.4-apache
            min_php: 8.4.27
          - image: php
            tag: 8.3-fpm-7
            context: images/8.3-fpm
            min_php: 8.3.36
          - image: php
            tag: 8.3-apache-7
            context: images/8.3-apache
            min_php: 8.3.36
          - image: php
            tag: 8.2-fpm-7
            context: images/8.2-fpm
            min_php: 8.2.35
          - image: php
            tag: 8.2-apache-7
            context: images/8.2-apache
            min_php: 8.2.35
          - image: php
            tag: 8.1-fpm-7
            context: images/8.1-fpm
          - image: php
            tag: 8.1-apache-7
            context: images/8.1-apache
          - image: php
            tag: 8.0-fpm-7
            context: images/8.0-fpm
          - image: php
            tag: 8.0-apache-7
            context: images/8.0-apache
          - image: php
            tag: 7.4-fpm-7
            context: images/7.4-fpm
          - image: php
            tag: 7.4-apache-7
            context: images/7.4-apache
          - image: php
            tag: 7.3-fpm-7
            context: images/7.3-fpm
          - image: php
            tag: 7.3-apache-7
            context: images/7.3-apache
          - image: php
            tag: 7.2-fpm-7
            context: images/7.2-fpm
          - image: php
            tag: 7.2-apache-7
            context: images/7.2-apache
          - image: php
            tag: 7.1-fpm-7
            context: images/7.1-fpm
          - image: php
            tag: 7.1-apache-7
            context: images/7.1-apache
          - image: php
            tag: 7.0-fpm-7
            context: images/7.0-fpm
          - image: php
            tag: 7.0-apache-7
            context: images/7.0-apache
          - image: php
            tag: 5.6-fpm-7
            context: images/5.6-fpm
          - image: php
            tag: 5.6-apache-7
            context: images/5.6-apache

        platform:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set tag suffix
        id: release
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "tag_suffix=-edge" >> "$GITHUB_OUTPUT"
      # Build our images.
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push devwithlando/${{ matrix.target.image }}:${{ matrix.target.tag }}${{ steps.release.outputs.tag_suffix }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          outputs: type=image,name=devwithlando/${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          pull: true
          build-args: MIN_PHP=${{ matrix.target.min_php }}
          cache-from: type=gha,scope=${{ matrix.target.image }}-${{ matrix.target.tag }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.image }}-${{ matrix.target.tag }}-${{ matrix.platform.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.target.tag }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    # A failed unrelated target must not block complete security-image pairs.
    if: ${{ !cancelled() }}
    needs: buildx
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: *targets
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v7
        with:
          name: digests-${{ matrix.target.tag }}-amd64
          path: ${{ runner.temp }}/digests/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@v7
        with:
          name: digests-${{ matrix.target.tag }}-arm64
          path: ${{ runner.temp }}/digests/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multiarch tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: devwithlando/${{ matrix.target.image }}
          TAG: ${{ matrix.target.tag }}${{ github.event_name == 'pull_request' && '-edge' || '' }}
        run: |
          shopt -s nullglob
          amd64=(amd64/*)
          arm64=(arm64/*)
          test "${#amd64[@]}" -eq 1
          test "${#arm64[@]}" -eq 1
          digests=("${amd64[0]##*/}" "${arm64[0]##*/}")
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${digests[@]/#/$IMAGE@sha256:}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
